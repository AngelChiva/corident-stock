<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corident Stock</title>
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Corident Stock">
<meta name="theme-color" content="#ff1493">
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,system-ui,sans-serif;background:#fff5fa;color:#333;text-align:center;padding:24px;box-sizing:border-box}
  img{width:120px;height:120px;border-radius:26px;box-shadow:0 6px 20px rgba(255,20,147,.25)}
  a{display:inline-block;margin-top:24px;padding:14px 28px;border-radius:12px;background:#e6007e;color:#fff;font-weight:700;text-decoration:none}
  p{max-width:320px;line-height:1.4}
</style>
</head>
<body>
<img src="icono-512.png" alt="Corident Stock">
<a id="go" href="https://script.google.com/a/macros/corident.es/s/AKfycbwO6nYeRDLBhafJqhIUwJVoSG_HOqciF4OPAApGKy9EDni3r3RvdZblUUIBvxKopeDk3g/exec">Abrir Corident Stock</a>
<p id="tip" hidden>Ahora pulsa Compartir → «Añadir a pantalla de inicio». El icono te llevará directo a la app.</p>
<script>
  // Normal: entra directa en la app. Con ?instalar se queda aquí para poder añadirla a la pantalla de inicio,
  // y se limpia la dirección para que el icono guardado entre directo.
  if (/[?&]instalar\b/.test(location.search)) {
    history.replaceState(null, "", location.pathname);
    document.getElementById('tip').hidden = false;
  } else location.replace(document.getElementById('go').href);
</script>
</body>
</html>
